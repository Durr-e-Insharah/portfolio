<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Insharah | Portfolio</title>
    <style>
        :root {
            --bg-gradient: linear-gradient(135deg, #0F0F10 0%, #1a0a0c 50%, #2b0d10 100%);
            --card-beige: #1C1416;      /* Dark card surface */
            --nav-bg: #0A0A0B;          /* Near-black navbar */
            --text-dark: #F0EAE4;       /* Light warm text (for contrast on dark bg) */
            --accent-red: #E63946;      /* Vibrant crimson accent */
            --accent-hover: #FF4C5B;    /* Brighter red hover on dark bg */
            --border-dark: #3A2226;     /* Subtle dark-red border */
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: var(--bg-gradient);
            background-attachment: fixed;
            color: var(--text-dark);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Navbar */
        header {
            background-color: var(--nav-bg);
            border-bottom: 4px solid var(--accent-red);
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            max-width: 1100px;
            margin: 0 auto;
            padding: 1.2rem 2rem;
        }

        .logo {
            font-size: 1.8rem;
            font-weight: 900;
            color: #ffffff;
            letter-spacing: 1px;
        }

        .logo span {
            color: var(--accent-red);
        }

        .nav-links {
            display: flex;
            list-style: none;
            gap: 1.5rem;
        }

        .nav-links a {
            text-decoration: none;
            color: #e8ded1;
            font-weight: 700;
            font-size: 1rem;
            padding: 0.4rem 0.8rem;
            border-radius: 4px;
            transition: all 0.2s ease;
        }

        .nav-links a:hover {
            color: #ffffff;
            background-color: var(--accent-red);
        }

        /* Main Container */
        main {
            flex: 1;
            max-width: 1100px;
            width: 100%;
            margin: 0 auto;
            padding: 4rem 2rem;
        }

        /* Common Styling */
        .page-title {
            font-size: 2.8rem;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 2rem;
            border-left: 8px solid var(--accent-red);
            padding-left: 1rem;
        }

        .card {
            background-color: var(--card-beige);
            border: 2px solid var(--border-dark);
            border-radius: 12px;
            padding: 2rem;
            box-shadow: 6px 6px 0px var(--border-dark);
            transition: transform 0.2s ease;
        }

        .btn {
            display: inline-block;
            background-color: var(--accent-red);
            color: #ffffff;
            padding: 0.8rem 1.8rem;
            text-decoration: none;
            font-weight: 800;
            border-radius: 6px;
            border: 2px solid var(--border-dark);
            box-shadow: 3px 3px 0px var(--border-dark);
            transition: all 0.2s ease;
        }

        .btn:hover {
            background-color: var(--accent-hover);
            transform: translate(-2px, -2px);
            box-shadow: 5px 5px 0px var(--border-dark);
        }

        .grid-2 {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 2rem;
        }

        footer {
            background-color: var(--nav-bg);
            color: #e8ded1;
            text-align: center;
            padding: 1.5rem;
            font-weight: 700;
            border-top: 4px solid var(--accent-red);
        }
    </style>
</head>
<body>

    <header>
        <nav class="navbar">
            <div class="logo">Insharah<span>.</span></div>
            <ul class="nav-links">
                <li><a href="{% url 'home' %}">Home</a></li>
                <li><a href="{% url 'about' %}">About</a></li>
                <li><a href="{% url 'projects' %}">Projects</a></li>
                <li><a href="{% url 'skills' %}">Skills</a></li>
                <li><a href="{% url 'services' %}">Services</a></li>
                <li><a href="{% url 'contact' %}">Contact Us</a></li>
            </ul>
        </nav>
    </header>

    <main>
        {% block content %}
        {% endblock %}
    </main>

    <footer>
        <p>&copy; 2026 Insharah | Portfolio</p>
    </footer>

</body>
</html>
